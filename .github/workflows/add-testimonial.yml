name: Add Testimonial from Formspree

on:
  repository_dispatch:
    types: [formspree_submission]

jobs:
  add-testimonial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Parse and add testimonial
        id: process
        run: |
          # Get the form data from the dispatch event
          DATA='${{ toJson(github.event.client_payload) }}'

          # Check if this is a testimonial form
          FORM_TYPE=$(echo "$DATA" | jq -r '.form_type // empty')

          if [ "$FORM_TYPE" = "testimonial" ]; then
            # Extract fields
            NAME=$(echo "$DATA" | jq -r '.name // "Anonymous"')
            QUOTE=$(echo "$DATA" | jq -r '.message // ""')
            SESSION_TYPE=$(echo "$DATA" | jq -r '.session_type // "Other"')
            STARS=$(echo "$DATA" | jq -r '.star_rating // 5')

            # Escape quotes for JSON
            QUOTE_ESCAPED=$(echo "$QUOTE" | jq -R '.')

            # Read existing testimonials
            TESTIMONIALS=$(cat testimonials.json)

            # Add new testimonial
            NEW_TESTIMONIAL=$(cat <<EOF
{
  "name": $NAME,
  "quote": $QUOTE_ESCAPED,
  "type": "$SESSION_TYPE",
  "stars": $STARS
}
EOF
)

            # Append to array
            UPDATED=$(echo "$TESTIMONIALS" | jq ". += [$NEW_TESTIMONIAL]")

            # Write back to file
            echo "$UPDATED" | jq '.' > testimonials.json

            echo "added=true" >> $GITHUB_OUTPUT
            echo "name=$NAME" >> $GITHUB_OUTPUT
          else
            echo "added=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.process.outputs.added == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add testimonials.json
          git commit -m "Add new testimonial from ${{ steps.process.outputs.name }}" || true
          git push
